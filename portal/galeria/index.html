<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galería de Imágenes - IESTP Paiján</title>
  <meta name="description" content="Galería de imágenes del IESTP Paiján: eventos académicos, instalaciones, actividades estudiantiles y más." />
  <link rel="canonical" href="https://www.iestpaijan.edu.pe/portal/galeria/" />
  <link rel="stylesheet" href="../css/styles.css?v=8" />
  <link rel="stylesheet" href="../css/galeria.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="../imagenes/logo-transp.png" type="image/png">
  <link rel="stylesheet" href="../fontawesome/css/all.min.css">
</head>
<body>
<div data-include="shell" data-root="../" data-home="../../" data-page="galeria"></div>

<section class="section-banner reveal-on-scroll">
  <h1><i class="fas fa-images"></i> Galería</h1>
</section>

<section class="container reveal-on-scroll" style="max-width:800px;margin:2rem auto;text-align:center;font-size:1.05rem;line-height:1.7;color:#555;padding:0 1rem;">
  <p>Explora las imágenes de nuestro instituto: eventos académicos, instalaciones, actividades estudiantiles y más. Haz clic en cualquier imagen para verla a tamaño completo.</p>
</section>

<main id="galeria" class="galeria container reveal-on-scroll"></main>

<div id="galeriaModal" class="modal">
  <button class="modal__close">&times;</button>
  <button id="zoomBtn" class="modal__zoom" title="Zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
  <span id="zoomLevel" class="modal__zoom-level">100%</span>

  <button id="prevBtn" class="carousel-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button id="nextBtn" class="carousel-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>

  <div class="modal__content">
    <img id="galeriaModalImg" src="" alt="Imagen de la galería">
    <p id="galeriaModalDesc"></p>
  </div>
</div>

<script src="../js/galeria.js"></script>
<script src="../js/include.js"></script>
<script src="../js/script.js?v=7"></script>
</body>
</html>
