<!DOCTYPE html>

<html lang="es">



<head>

    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Bolsa Laboral - IESTP PAIJÁN</title>

    <meta name="description" content="Presentación institucional del IESTP PAIJÁN." />

    <link rel="stylesheet" href="../css/styles.css?v=8" />

    <link rel="stylesheet" href="../css/bolsa_laboral.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="icon" href="../imagenes/logo-transp.png" type="image/png">

    <link rel="stylesheet" href="../fontawesome/css/all.min.css">

</head>



<body>

<div data-include="shell" data-root="../" data-home="../../" data-page="bolsa"></div>

<section class="section-banner">

        <h1><i class="fas fa-briefcase"></i> Bolsa Laboral</h1>

    </section>



    <!-- Sección laboral -->

    <main id="laboral" class="laboral container">

        <section class="laboral__roles">

            <div class="rol-card">

                <picture><source srcset="../imagenes/bolsa_trabajo/estudiantes-egresados.avif" type="image/avif"><source srcset="../imagenes/bolsa_trabajo/estudiantes-egresados.webp" type="image/webp"><img src="../imagenes/bolsa_trabajo/estudiantes-egresados.jpg" alt="Estudiantes y egresados"></picture>

                <h4><a href="https://siitec.grell.gob.pe/authentication" target="_blank">Estudiantes y egresados</a>

                </h4>

            </div>



            <div class="rol-card">

                <picture><source srcset="../imagenes/bolsa_trabajo/docentes.avif" type="image/avif"><source srcset="../imagenes/bolsa_trabajo/docentes.webp" type="image/webp"><img src="../imagenes/bolsa_trabajo/docentes.jpg" alt="Docente"></picture>

                <h4><a href="https://siitec.grell.gob.pe/authentication" target="_blank">Docentes</a></h4>

            </div>



            <div class="rol-card">

                <picture><source srcset="../imagenes/bolsa_trabajo/administrador.avif" type="image/avif"><source srcset="../imagenes/bolsa_trabajo/administrador.webp" type="image/webp"><img src="../imagenes/bolsa_trabajo/administrador.jpg" alt="Administrador"></picture>

                <h4><a href="https://siitec.grell.gob.pe/authentication" target="_blank">Administrador</a></h4>

            </div>

        </section>

    </main>



    <!-- ?? Modal de Login / Registro -->

    <div id="authModal" class="modal">

        <div class="modal-content">

            <span class="close-btn">&times;</span>

            <div class="tabs">

                <button class="tab-btn active" data-tab="login">Iniciar sesión</button>

                <button class="tab-btn" data-tab="register">Registrarse</button>

            </div>



            <!-- Login -->

            <div class="tab-panel active" id="login">

                <h2>Iniciar sesión</h2>

                <form>

                    <input type="email" placeholder="Correo electrónico" required>

                    <input type="password" placeholder="Contraseña" required>

                    <button type="submit" class="btn-primary full">Ingresar</button>

                </form>

            </div>



            <!-- Registro -->

            <div class="tab-panel" id="register">

                <h2>Crear cuenta</h2>

                <form>

                    <input type="text" placeholder="Nombre completo" required>

                    <input type="email" placeholder="Correo electrónico" required>

                    <input type="password" placeholder="Contraseña" required>

                    <button type="submit" class="btn-primary full">Registrar</button>

                </form>

            </div>

        </div>

    </div>



    <script>

    const openModalBtn = document.getElementById("openModal");

    const modal = document.getElementById("authModal");

    const closeBtn = document.querySelector(".close-btn");

    const tabButtons = document.querySelectorAll(".tab-btn");

    const tabPanels = document.querySelectorAll(".tab-panel");



    // Abrir modal

    openModalBtn.addEventListener("click", () => {

        modal.style.display = "flex";

    });



    // Cerrar modal

    closeBtn.addEventListener("click", () => {

        modal.style.display = "none";

    });



    window.addEventListener("click", (e) => {

        if (e.target === modal) {

            modal.style.display = "none";

        }

    });



    // Cambiar pestañas

    tabButtons.forEach(btn => {

        btn.addEventListener("click", () => {

            tabButtons.forEach(b => b.classList.remove("active"));

            tabPanels.forEach(p => p.classList.remove("active"));



            btn.classList.add("active");

            document.getElementById(btn.dataset.tab).classList.add("active");

        });

    });

    </script>



        <script src="../js/include.js"></script>

    <script src="../js/script.js?v=7"></script></body>



</html>
