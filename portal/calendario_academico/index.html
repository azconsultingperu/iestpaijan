<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendario Académico - IESTP PAIJÁN</title>
    <meta name="description" content="Consulta el calendario académico del IESTP Paiján" />
    <link rel="stylesheet" href="../css/styles.css?v=8" />
    <link rel="stylesheet" href="../css/matricula.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="../imagenes/logo-transp.png" type="image/png">
    <link rel="stylesheet" href="../fontawesome/css/all.min.css">
</head>
<body>
<div data-include="shell" data-root="../" data-home="../../" data-page="calendario"></div>

<section class="section-banner">
    <h1><i class="fas fa-calendar-alt"></i> Calendario Académico <span id="anio"></span></h1>
</section>

<main id="calendario" class="calendario container">
    <div class="calendario__hero">
        <div>
            <span class="calendario__eyebrow">Consulta oficial</span>
            <h2>Calendario académico 2026</h2>
            <p>Revisa las fechas importantes, actividades y procesos académicos del año vigente.</p>
        </div>
        <a class="calendario__btn" href="../documentos/calendario_academico/calendario-academico-2026.pdf" target="_blank" rel="noopener noreferrer">
            <i class="fas fa-file-pdf"></i>
            Abrir PDF
        </a>
    </div>

    <div class="calendario__pdf">
        <iframe src="../documentos/calendario_academico/calendario-academico-2026.pdf#toolbar=0"
            type="application/pdf"
            id="pdfFrame"
            title="Calendario académico PDF">
        </iframe>
    </div>
</main>

<script>
    document.addEventListener("contextmenu", function (e) {
        if (e.target.closest("#pdfFrame")) {
            e.preventDefault();
        }
    });
</script>

<script src="../js/include.js"></script>
<script src="../js/script.js?v=7"></script>
</body>
</html>
