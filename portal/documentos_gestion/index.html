<body>
<div data-include="shell" data-root="../" data-home="../../" data-page="doc-gestion"></div>
<section class="section-banner">
  <h1><i class="fas fa-file-contract"></i> Documentos en Gestión <span id="anio"></span></h1>
</section>

<script>
  const fecha = new Date();
  const año = fecha.getFullYear();
  const mes = fecha.getMonth() + 1; // enero = 1, diciembre = 12

  // Condición: si mes >= 8 ? "20", si no ? "10"
  const sufijo = mes >= 8 ? "20" : "10";

  // Insertar en el span el resultado
  //document.getElementById("anio").textContent = año + sufijo;
  document.getElementById("anio").textContent = año;
</script>

<!-- Sección documentos_gestion -->
<main id="documentos_gestion" class="documentos_gestion container">
  <h2 class="titulo-seccion">Documentación de Gestión</h2>
  <div class="documentos-grid" id="documentos-lista">
    <!-- Se carga desde JS -->
  </div>
</main>

<!-- Modal para vista previa -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="modal__close">&times;</span>
    <h2 id="modal-title"></h2> <!-- Aquí irá el título dinámico -->
    <iframe id="pdfViewer" src="" frameborder="0"></iframe>
  </div>
</div>

<script src="../js/documentos.js"></script>
